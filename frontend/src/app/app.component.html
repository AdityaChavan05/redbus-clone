<app-navbar></app-navbar>

<router-outlet></router-outlet>

<!-- redBus-style Login / Sign-up Overlay Modal -->
<div *ngIf="showLoginModal" class="login-modal-overlay">
  <div class="login-modal-card">
    <button type="button" class="close-btn" (click)="closeLoginModal()">✕</button>

    <div class="login-header">
      <div class="redbus-brand-badge">redBus</div>
      <h3>Sign in to book faster</h3>
      <p>Save passenger details and track your tickets seamlessly</p>
    </div>

    <!-- Mobile Number OTP Flow -->
    <div class="login-body">
      <div class="phone-input-group">
        <span class="country-code">+91</span>
        <input 
          type="tel" 
          maxlength="10" 
          [(ngModel)]="mobileNumber" 
          placeholder="Enter 10-digit mobile number" 
          class="login-input" />
      </div>

      <button 
        type="button" 
        class="btn-send-otp" 
        (click)="loginWithPhone()">
        GENERATE OTP
      </button>

      <div class="auth-divider">
        <span>OR SIGN IN WITH</span>
      </div>

      <!-- Third-Party Social Logins -->
      <div class="social-login-grid">
        <button type="button" class="btn-social" (click)="loginWithSocial('Google')">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google
        </button>

        <button type="button" class="btn-social" (click)="loginWithSocial('Microsoft')">
          <svg class="social-icon" viewBox="0 0 23 23">
            <path fill="#f35325" d="M1 1h10v10H1z"/>
            <path fill="#81bc06" d="M12 1h10v10H12z"/>
            <path fill="#05a6f0" d="M1 12h10v10H1z"/>
            <path fill="#ffba08" d="M12 12h10v10H12z"/>
          </svg>
          Microsoft
        </button>
      </div>

      <div class="disclaimer">
        By continuing, you agree to our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.
      </div>
    </div>
  </div>
</div>
