<div class="mt-4 pt-4 border-t border-slate-200">
  <h5 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Primary Passenger Details</h5>

  <div *ngIf="errorMessage" class="mb-3 p-2 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="proceedToPayment()" class="space-y-3">
    <div>
      <label class="block text-[11px] font-medium text-slate-600 mb-1">Full Name *</label>
      <input 
        type="text" 
        [(ngModel)]="passenger.name" 
        name="pname" 
        required 
        placeholder="e.g. Rahul Sharma"
        class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-rose-500 focus:outline-none" />
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-[11px] font-medium text-slate-600 mb-1">Age *</label>
        <input 
          type="number" 
          [(ngModel)]="passenger.age" 
          name="page" 
          required 
          placeholder="e.g. 26"
          class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-rose-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-[11px] font-medium text-slate-600 mb-1">Gender *</label>
        <select 
          [(ngModel)]="passenger.gender" 
          name="pgender" 
          class="w-full text-xs p-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-rose-500 focus:outline-none">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-[11px] font-medium text-slate-600 mb-1">Mobile Number *</label>
      <div class="flex">
        <span class="inline-flex items-center px-2 text-xs text-slate-500 bg-slate-100 border border-r-0 border-slate-300 rounded-l">+91</span>
        <input 
          type="tel" 
          [(ngModel)]="passenger.phone" 
          name="pphone" 
          required 
          maxlength="10" 
          placeholder="9876543210"
          class="w-full text-xs p-2 border border-slate-300 rounded-r focus:ring-1 focus:ring-rose-500 focus:outline-none" />
      </div>
    </div>

    <div>
      <label class="block text-[11px] font-medium text-slate-600 mb-1">Email ID *</label>
      <input 
        type="email" 
        [(ngModel)]="passenger.email" 
        name="pemail" 
        required 
        placeholder="rahul@example.com"
        class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-rose-500 focus:outline-none" />
    </div>

    <button 
      type="submit" 
      class="w-full mt-2 py-2.5 px-4 bg-[#d84e55] hover:bg-[#b83b41] text-white font-bold text-xs uppercase tracking-wider rounded transition-colors shadow">
      Proceed to Payment
    </button>
  </form>
</div>
