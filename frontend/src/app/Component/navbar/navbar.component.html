<nav class="navbar-wrapper">
  <div class="nav-container">
    
    <!-- BRAND LOGO -->
    <a routerLink="/" class="brand-link">
      <span class="brand-red-txt">red</span><span class="brand-dark-txt">Bus</span>
      <span class="badge-pro">PRO</span>
    </a>

    <!-- NAV LINKS -->
    <div class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="icon">🚌</span>
        <span>{{ 'NAV.BUS_TICKETS' | translate }}</span>
      </a>
      <a routerLink="/planner" routerLinkActive="active" class="nav-item">
        <span class="icon">🗺️</span>
        <span>{{ 'NAV.ROUTE_PLANNER' | translate }}</span>
      </a>
      <a routerLink="/community" routerLinkActive="active" class="nav-item">
        <span class="icon">💬</span>
        <span>{{ 'NAV.COMMUNITY' | translate }}</span>
      </a>
      <a routerLink="/reviews" routerLinkActive="active" class="nav-item">
        <span class="icon">⭐</span>
        <span>{{ 'NAV.REVIEWS' | translate }}</span>
      </a>
    </div>

    <!-- RIGHT UTILITIES -->
    <div class="nav-actions">
      
      <!-- LANGUAGE SWITCHER DROPDOWN -->
      <div class="lang-selector-box">
        <span class="globe-icon">🌐</span>
        <select [ngModel]="selectedLanguage" (ngModelChange)="onLanguageChange($event)" class="lang-select">
          <option value="en">English (EN)</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
        </select>
      </div>

      <!-- FULL-SCREEN DARK/LIGHT TOGGLE BUTTON -->
      <button type="button" class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Switch to Light' : 'Switch to Dark'">
        <span class="theme-icon">{{ isDarkMode ? '☀️' : '🌙' }}</span>
        <span class="theme-label">{{ isDarkMode ? ('THEME.LIGHT' | translate) : ('THEME.DARK' | translate) }}</span>
      </button>

      <!-- NOTIFICATIONS BELL -->
      <a routerLink="/notifications" class="notif-btn" title="Notifications">
        <span class="bell-icon">🔔</span>
        <span class="notif-badge" *ngIf="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
      </a>

      <!-- ACCOUNT PROFILE BUTTON -->
      <a routerLink="/profile" class="account-btn">
        <span class="avatar-circle">👤</span>
        <span class="account-txt">{{ 'NAV.ACCOUNT' | translate }}</span>
      </a>

    </div>

  </div>
</nav>
